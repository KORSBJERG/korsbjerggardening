rbrug','clock')+stat('Afventer godkendelse',state.tasks.filter(t=>t.status==='Afventer godkendelse').length,'','Forslag sendt til kundevisning','file')+'</div><div class="columns"><div>'+section('Dagens arbejde','Små og store opgaver, der gør en forskel.','Alle opgaver','tasks')+'<div class="panel"><div class="tabs">'+['I dag','Denne uge','Afsluttede'].map(t=>'<button class="'+(taskView===t?'active':'')+'" data-taskview="'+t+'">'+t+'</button>').join('')+'</div>'+today.map(taskRow).join('')+(today.length?'':'<div class="empty">Der er ingen opgaver her endnu.</div>')+'</div><div class="garden-section">'+section('Haver i gode hænder',state.gardens.length+' haver · hver med sin egen historie','Alle haver','gardens')+'<div class="gardens">'+state.gardens.slice(0,3).map(gardenCard).join('')+'</div></div></div><div class="rightcol"><div class="aside-card"><div class="section-head"><h3 style="margin:0">Seneste aktivitet</h3>'+icon('clock')+'</div>'+state.notifications.slice(0,3).map(n=>'<div class="activity"><b>'+esc(n.title)+'</b><p>'+esc(n.text)+'</p><small>'+new Date(n.date).toLocaleDateString('da-DK',{day:'numeric',month:'short'})+'</small></div>').join('')+'<button class="textbtn" data-nav="notifications">Se al aktivitet '+icon('arrow')+'</button></div><div class="aside-card"><div class="section-head"><h3 style="margin:0">Dine haver på kortet</h3>'+icon('map')+'</div>'+mapSvg()+'<div class="map-caption"><span>Havens adresse i Google Maps</span><button data-nav="map">Åbn kort ↗</button></div></div></div></div>'}

function hoursPage(){let logs=state.logs.filter(l=>(!customerMode||l.garden===selectedGarden)&&(filter==='Alle'||l.garden===filter));const sum=logs.reduce((s,l)=>s+Number(l.hours),0);return heading('TID TIL DET GRØNNE','Timer & forbrug','Gennemsigtig registrering af arbejdet i hver have.',customerMode?btn('Hent CSV','export','download',true):btn('Registrer timer','newLog','plus'))+(!customerMode?'<div class="toolbar">'+(state.timer?'':btn('Start tidtagning','startTimer','play',true))+btn('Eksportér CSV','export','download',true)+'</div>':'')+'<div class="stats">'+stat('Registreret i november',fmt(sum),'t','Faktisk registreret arbejdstid','clock')+stat('Besøg med tidsregistrering',logs.length,'','Dokumenteret arbejde','calendar')+stat('Månedlig timeramme',fmt(state.gardens.filter(g=>!customerMode||g.id===selectedGarden).reduce((s,g)=>s+Number(g.budget),0)),'t','Samlet aftalt ramme','file')+stat('Haver i oversigten',new Set(logs.map(l=>l.garden)).size,'','Havepleje med overblik','leaf')+'</div>'+(!customerMode?'<div class="toolbar"><select class="input" id="filter" aria-label="Filtrer have"><option value="Alle">Alle haver</option>'+state.gardens.map(g=>'<option value="'+g.id+'" '+(filter===g.id?'selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select></div>':'')+'<div class="panel tablewrap"><table class="table"><thead><tr><th>DATO</th><th>HAVE & ARBEJDE</th><th>NOTAT</th><th>IND / UD</th><th>TIMER</th></tr></thead><tbody>'+logs.slice().reverse().map(l=>'<tr><td>'+date(l.date)+'</td><td>'+esc(l.task)+'<small>'+esc(garden(l.garden).name)+'</small></td><td>'+esc(l.note)+'</td><td>'+(l.checkedInAt?clockTime(l.checkedInAt)+' → '+clockTime(l.checkedOutAt):'—')+'</td><td>'+(l.durationSeconds?elapsedLabel(l.durationSeconds):fmt(l.hours)+' t')+(!customerMode?'<br><button class="textbtn" data-log-publish="'+esc(l.id)+'">'+(l.customerVisible?'Skjul i portal':'Vis i portal')+'</button>':'')+'</td></tr>').join('')+'</tbody></table>'+(!logs.length?'<div class="empty">Ingen registrerede timer endnu.</div>':'')+'</div>'}
function calendarPage(){return heading('PLANLÆG DIN UGE','Plads til det hele.','Uge 45 · 2.–8. november 2026',btn('Opret opgave','newTask'))+'<div class="panel tablewrap"><div class="week">'+['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map((d,i)=>{const key='2026-11-0'+(i+2);return '<div class="day" style="'+(i===4?'background:#f5f7ee':'')+'"><span>'+d.toUpperCase()+'</span><b>'+(i+2)+'</b>'+state.tasks.filter(t=>t.date===key).map(t=>'<button class="event" data-task="'+t.id+'"><small>'+esc(t.time)+' · '+fmt(t.hours)+' t</small>'+esc(t.title)+'<small>'+esc(garden(t.garden).name)+'</small></button>').join('')+'</div>'}).join('')+'</div></div><div style="margin-top:28px">'+section('Kommende besøg','Efter denne uge')+'<div class="panel">'+state.tasks.filter(t=>t.date>'2026-11-08').map(taskRow).join('')+'</div></div>'}
function messagesPage(){return heading('DEN PERSONLIGE KONTAKT','En direkte linje til haven.','Beskeder og aftaler, der følger den enkelte have.')+(!customerMode?'<div class="toolbar"><select class="input" id="gardenSelect" aria-label="Vælg kunde">'+state.gardens.map(g=>'<option value="'+g.id+'" '+(g.id===selectedGarden?'selected':'')+'>'+esc(g.name)+' · '+esc(g.customer)+'</option>').join('')+'</select></div>':'')+'<div class="panel panelpad"><div class="section-head"><h2>'+esc(garden(selectedGarden).name)+'</h2><span class="pill">Kundesamtale</span></div>'+state.messages.filter(m=>m.garden===selectedGarden).map(m=>'<div class="message '+((m.senderId===me.id||!m.senderId&&!customerMode&&m.from==='Anton')?'mine':'')+'">'+esc(m.text)+'<small>'+esc(m.from)+' · '+new Date(m.date).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</small></div>').join('')+'<form id="messageForm" class="formline"><input class="input" name="text" required maxlength="2000" placeholder="Skriv en besked…" aria-label="Din besked"><button class="btn" '+(!loaded?'disabled':'')+'>'+icon('arrow')+'Send</button></form><p style="font-size:9px;color:#8c967f;margin-bottom:0">Beskeder deles med Anton og brugerne tilknyttet denne have. Der sendes ingen e-mail eller SMS.</p></div>'}

function enhanceResponsiveTables(){document.querySelectorAll('table.table').forEach(table=>{const labels=Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());table.querySelectorAll('tbody tr').forEach(row=>Array.from(row.children).forEach((cell,i)=>cell.dataset.label=labels[i]||'Handling'))})}

function completeTask(id){if(state.timer?.taskId===id&&!customerMode){openCheckOut();return}if(customerMode){taskDetail(id);return}const t=state.tasks.find(t=>t.id===id);t.status=t.status==='Afsluttet'?'Planlagt':'Afsluttet';if(state.prefs.visit)notify(t.status==='Afsluttet'?'Et godt stykke arbejde er færdigt':'Opgaven er genåbnet',t.title+' · '+garden(t.garden).name);save();close();render();toast(t.status==='Afsluttet'?'Opgaven er afsluttet. Husk at registrere faktisk tid.':'Opgaven er genåbnet.')}
const close=()=>document.getElementById('modal').innerHTML='';
function exportCsv(){const rows=[['Dato','Have','Arbejde','Timer','Notat','Tjek ind','Tjek ud'],...state.logs.filter(l=>!customerMode||l.garden===selectedGarden).map(l=>[l.date,garden(l.garden).name,l.task,fmt(l.hours),l.note,l.checkedInAt||'',l.checkedOutAt||''])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='antons-gardening-timer.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Timeregistrering er eksporteret.')}
function updateClock(){if(!state.timer)return;const seconds=Math.max(0,Math.floor((Date.now()-state.timer.start)/1000));document.querySelectorAll('[data-live-clock]').forEach(el=>el.textContent=elapsedLabel(seconds))}

document.addEventListener('click',e=>{const b=e.target.closest('button,[data-garden]');if(!b)return;if(attendanceBusy){toast('Gemmer indtjekning…');return}if(!loaded&&b.dataset.action!=='menu'&&b.dataset.action!=='reload'){toast('Vent et øjeblik, mens oplysningerne hentes.');return}const d=b.dataset;if(pdfMailClick(b))return;if(mailBusy){toast('Behandler PDF eller mail…');return}if(commercialClick(b))return;if(commerceBusy){toast('Gemmer ændringer…');return}
 if(d.checkin){checkIn(d.checkin);return}if(d.checkout){openCheckOut();return}if(d.nav){navigate(d.nav);return}if(d.task){taskDetail(d.task);return}if(d.garden){gardenDetail(d.garden);return}if(d.complete){completeTask(d.complete);return}if(d.taskview){taskView=d.taskview;render();return}if(d.toggle){state.prefs[d.toggle]=!state.prefs[d.toggle];save();render();return}if(d.read){state.notifications.find(n=>n.id===d.read).read=true;save();render();return}
 if(d.approve||d.decline){const t=state.tasks.find(t=>t.id===(d.approve||d.decline));if(d.approve)t.status='Planlagt';else {t.status='Afsluttet';t.note+=' [Forslaget blev afvist af kunden i demoen.]'}notify(d.approve?'Forslag godkendt':'Forslag afvist',t.title+' · '+garden(t.garden).name);save();close();render();toast(d.approve?'Tak! Opgaven er godkendt.':'Forslaget er afvist.');return}
 if(d.editTask){const t=state.tasks.find(t=>t.id===d.editTask);formModal('Rediger opgave','edit:'+t.id,input('Opgave','title',t.title,'text','maxlength="150"')+input('Dato','date',t.date,'date')+input('Tid','time',t.time,'time')+input('Estimerede timer','hours',t.hours,'number','min="0.25" max="500" step="0.25"')+'<label>Status<select class="input" name="status">'+['Planlagt','I gang','Afventer godkendelse','Afsluttet'].map(s=>'<option '+(s===t.status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="full">Beskrivelse<textarea class="input" name="note" rows="3" maxlength="2000">'+esc(t.note)+'</textarea></label>');return}
 switch(d.action){case 'openAccess':navigate('access');break;case 'toggleVideo':{const video=b.closest('.hero').querySelector('.hero-film');if(video.paused){if(!video.getAttribute('src'))video.src=video.dataset.src;video.muted=true;video.play().then(()=>{video.closest('.hero').querySelector('.film-label').textContent='Korsbjerg Gardening · Have service'}).catch(()=>toast('Videoen kunne ikke afspilles. Prøv igen senere.'))}else video.pause();break}case 'menu':document.getElementById('sidebar').classList.toggle('open');syncAppNav();break;case 'closeMenu':document.getElementById('sidebar').classList.remove('open');syncAppNav();break;case 'switch':break;case 'close':close();break;case 'newTask':newTask();break;case 'newGarden':newGarden();break;case 'newLog':newLog();break;case 'contact':close();navigate('messages');break;case 'gardenMap':close();navigate('map');break;case 'gardenTasks':close();navigate(customerMode?'visits':'tasks');break;case 'visits':navigate('visits');break;case 'export':exportCsv();break;case 'readAll':state.notifications.forEach(n=>n.read=true);save();render();toast('Alle notifikationer er markeret som læst.');break;case 'reload':location.reload();break;case 'agreement':modal('Din haveaftale','<p style="line-height:1.9">Fast havepleje hos '+esc(garden(selectedGarden).name)+'.<br>'+fmt(garden(selectedGarden).budget)+' timer pr. måned til plæne, bede, hæk og sæsonarbejde. Ekstraopgaver kræver særskilt godkendelse.</p><div class="notice">Dette er et aftaleeksempel. Pris, vilkår og en bindende aftale er endnu ikke tilføjet.</div>');break;case 'season':modal('November i haven','<p style="font-size:13px;line-height:2">Lad lidt løv ligge i bedene som vinterly.<br>Fjern løv fra græsplænen, så græsset får lys.<br>Læg forårsløg, mens jorden stadig er blød.<br>Beskyt sarte planter med grangrene.<br>Giv fuglene vand og et roligt hjørne.</p><div class="notice">Tilpas altid arbejdet til havens planter og det lokale vejr.</div>');break;case 'startTimer':if(state.timer){toast('Du har allerede en aktiv indtjekning.');break}formModal('Start tidtagning','timer',gardenSelect()+input('Hvad arbejder du på?','task','','text','maxlength="150"'));break;case 'stopTimer':openCheckOut();break}});
document.addEventListener('submit',async e=>{if(e.target.id==='offerMailForm'){e.preventDefault();submitOfferMail(e.target,e.submitter?.value||'draft');return}if(e.target.id==='companyForm'){e.preventDefault();if(!customerMode&&!commerceBusy&&!attendanceBusy)commercialChange(()=>{state.company=Object.fromEntries(new FormData(e.target))},'Firmaoplysninger er gemt.');return}if(mailBusy){e.preventDefault();return}if(e.target.id==='commerceForm'||e.target.id==='quoteEditor'){e.preventDefault();if(!commerceBusy&&!attendanceBusy)commercialSubmit(e.target);return}if(commerceBusy){e.preventDefault();return}if(e.target.id==='checkoutForm'){e.preventDefault();confirmCheckOut(e.target);return}if(attendanceBusy){e.preventDefault();return}if(e.target.id==='messageForm'){e.preventDefault();const text=new FormData(e.target).get('text').trim();if(!text)return;state.messages.push({id:crypto.randomUUID(),garden:selectedGarden,from:customerMode?'Sofie Jensen':'Anton',text,date:new Date().toISOString()});if(state.prefs.inapp)notify('Ny besked i '+garden(selectedGarden).name,text.slice(0,100));save();render();toast('Beskeden er gemt i samtalen.');return}if(e.target.id!=='editor')return;e.preventDefault();const previous=JSON.parse(JSON.stringify(state));const v=Object.fromEntries(new FormData(e.target));const type=e.target.dataset.type;const id=crypto.randomUUID();if(type==='task'){state.tasks.push({...v,id,hours:Number(v.hours),billing:{mode:v.billingMode||'hourly',price:Number(v.billingPrice??state.pricing.hourlyRate),agreedAt:new Date().toISOString()}});notify('Ny opgave oprettet',v.title+' · '+garden(v.garden).name)}if(type==='garden')state.gardens.push({...v,id,area:Number(v.area),budget:Number(v.budget),photo:state.gardens.length%3});if(type==='log'){state.logs.push({...v,id,hours:Number(v.hours)});if(state.prefs.report)notify('Timer registreret',v.hours+' timer · '+garden(v.garden).name)}if(type==='timer'){if(state.timer){toast('En anden indtjekning er allerede aktiv.');return}state.timer={...v,sessionId:crypto.randomUUID(),start:Date.now()};}if(type.startsWith('edit:'))Object.assign(state.tasks.find(t=>t.id===type.slice(5)),v,{hours:Number(v.hours)});if(await save()){close();render();toast('Ændringen er registreret.')}else{state=previous;render()}});
document.addEventListener('change',e=>{commercialInput(e);if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='gardenSelect'){selectedGarden=e.target.value;render()}});document.addEventListener('input',e=>{commercialInput(e);if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();document.getElementById('sidebar').classList.remove('open');syncAppNav()}if(e.key==='Tab'&&document.querySelector('.modal')){const all=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')];const a=all[0],b=all.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});window.addEventListener('popstate',()=>{customerMode=me?.role==='customer'||!me?.canOperate;page=customerMode?'portal':'overview';render()});setInterval(updateClock,1000);render();boot();
